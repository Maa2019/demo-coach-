<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141F45">
<title>Lloyd Demo Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --deep:#141F45; --mid:#1D2C60; --navy:#253C83; --cyan:#26A0DA;
  --gold:#F2B01E; --red:#EC1F28; --green:#2FA84F;
  --light:#DCE4F5; --mute:#9BA9CE; --line:#2E3F79;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--deep); color:var(--light);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--cyan)}
.hide{display:none!important}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:50; background:var(--deep);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
}
.hrow{display:flex;align-items:center;gap:10px}
.flag{width:26px;height:18px;border-radius:2px;overflow:hidden;display:flex;
  flex-direction:column;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.flag i{flex:1}
.flag i:nth-child(1){background:#FF9933}
.flag i:nth-child(2){background:#fff;position:relative}
.flag i:nth-child(2)::after{content:"";position:absolute;left:50%;top:50%;
  width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  border:1px solid #0A2A66}
.flag i:nth-child(3){background:#138808}
h1{margin:0;font-size:17px;font-weight:700;color:#fff;letter-spacing:.2px}
.tag{font-size:11px;color:var(--mute);margin-top:1px}
.back{background:var(--mid);border:1px solid var(--line);color:var(--light);
  border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}

/* ---------- home ---------- */
.wrap{padding:16px;max-width:820px;margin:0 auto}
.lead{background:var(--mid);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:18px}
.lead b{color:#fff}
.lead p{margin:6px 0 0;font-size:13.5px;color:var(--light)}

.sechead{font-size:11px;letter-spacing:1.6px;color:var(--cyan);font-weight:700;
  margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:11px}
.mcard{background:var(--mid);border:1px solid var(--line);border-radius:12px;
  padding:14px;display:flex;align-items:center;gap:13px;cursor:pointer;
  transition:transform .08s}
.mcard:active{transform:scale(.985)}
.sz{flex:0 0 auto;width:52px;height:52px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#141F45}
.mcard .nm{font-size:16px;font-weight:700;color:#fff}
.mcard .dt{font-size:12.5px;color:var(--mute);margin-top:2px}
.chev{margin-left:auto;color:var(--mute);font-size:20px}
.szchip{display:inline-block;font-size:11px;font-weight:800;color:#141F45;
  border-radius:5px;padding:2px 6px;margin-right:7px;vertical-align:2px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
  background:var(--deep);-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--mid);border:1px solid var(--line);
  color:var(--mute);border-radius:20px;padding:8px 15px;font-size:13px;
  font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--cyan);border-color:var(--cyan);color:#0E1733}

/* ---------- model header ---------- */
.mhead{background:var(--navy);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.mhead .n{font-size:20px;font-weight:800;color:#fff}
.mhead .t{font-size:13px;color:var(--light);margin-top:3px;font-style:italic}

/* ---------- blocks ---------- */
.blk{background:var(--mid);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:12px}
.blk h3{margin:0 0 10px;font-size:11px;letter-spacing:1.5px;font-weight:700}
.win h3{color:var(--cyan)} .dem h3{color:var(--gold)}
.pit h3{color:var(--green)} .obj h3{color:var(--red)}

.wp{display:flex;gap:11px;margin-bottom:13px}
.wp:last-child{margin-bottom:0}
.num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#141F45}
.wp .h{font-size:14.5px;font-weight:700;color:#fff}
.wp .b{font-size:13px;color:var(--light);margin-top:2px}

/* demo steps */
.step{display:flex;gap:11px;padding:11px;border-radius:10px;background:#16204A;
  margin-bottom:9px;cursor:pointer;border:1px solid transparent}
.step:last-child{margin-bottom:0}
.step.done{background:#123021;border-color:#2FA84F}
.box{flex:0 0 auto;width:24px;height:24px;border-radius:6px;border:2px solid var(--mute);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  font-weight:800;color:transparent}
.step.done .box{background:var(--green);border-color:var(--green);color:#fff}
.step .sl{font-size:10.5px;letter-spacing:1.2px;color:var(--gold);font-weight:700}
.step.done .sl{color:#7BD79A}
.step .st{font-size:13.5px;color:var(--light);margin-top:3px}

.say{background:#14322A;border:1px solid #2b5c46;border-radius:10px;
  padding:12px 13px;margin-bottom:10px}
.say .q{font-size:15px;color:#fff;font-style:italic;line-height:1.55}
.say .w{font-size:12.5px;color:#8FCFAE;margin-top:7px}

.ob{background:#16204A;border-radius:10px;padding:12px;margin-bottom:9px}
.ob .o{font-size:14.5px;font-weight:700;color:var(--gold)}
.ob .a{font-size:13px;color:#fff;margin-top:5px}
.ob .n{font-size:12px;color:var(--mute);font-style:italic;margin-top:6px}

/* vs table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;
  border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);
  white-space:nowrap}
thead th{background:#0E1733;color:var(--mute);font-size:11px;letter-spacing:.6px;
  position:sticky;left:0}
thead th.us{background:#2B4093;color:#fff}
tbody td:first-child{color:var(--mute)}
td.us{color:var(--gold);font-weight:700;background:#1A2450}
tbody tr:last-child td{border-bottom:none}

.note{font-size:12.5px;color:var(--mute);font-style:italic;margin-top:10px;
  line-height:1.5}
.warn{background:#3A1418;border:1px solid #6b2229;border-radius:10px;padding:12px;
  font-size:13px;color:#FFD9DB;margin-top:12px}

.up{background:#2B2010;border:1px solid #6b5220;border-radius:10px;padding:12px;
  margin-top:12px}
.up .l{font-size:11px;letter-spacing:1.4px;color:var(--gold);font-weight:700}
.up .v{font-size:14.5px;color:#fff;font-weight:700;margin-top:5px}
.up .d{font-size:12.5px;color:var(--light);margin-top:4px}

/* card image */
.cardimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.zoomnote{font-size:12px;color:var(--mute);margin-top:8px;text-align:center}

.fl{display:flex;align-items:center;gap:11px;padding:10px 2px;
  font-size:15px;color:#fff;border-bottom:1px solid #22305F}
.fl:last-child{border-bottom:none}
.dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.reset{width:100%;background:var(--mid);border:1px solid var(--line);
  color:var(--mute);border-radius:10px;padding:12px;font-size:13px;
  font-weight:600;cursor:pointer;margin-top:6px}
footer{padding:22px 16px calc(env(safe-area-inset-bottom) + 26px);text-align:center;
  font-size:11px;color:#5C6B99;line-height:1.6}

/* ================= ANIMATIONS ================= */
@media (prefers-reduced-motion: no-preference){

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(38,160,218,0)}50%{box-shadow:0 0 0 6px rgba(38,160,218,.12)}}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes barGrow{from{width:0}}

/* home cards stagger in */
.mcard{animation:fadeUp .42s cubic-bezier(.22,.9,.3,1) both}
.mcard:nth-child(1){animation-delay:.03s}
.mcard:nth-child(2){animation-delay:.09s}
.mcard:nth-child(3){animation-delay:.15s}
.sechead{animation:fadeIn .5s both}
.lead{animation:fadeUp .45s cubic-bezier(.22,.9,.3,1) both}

/* screen transitions */
#detail:not(.hide){animation:slideIn .3s cubic-bezier(.22,.9,.3,1) both}
#home:not(.hide){animation:slideBack .3s cubic-bezier(.22,.9,.3,1) both}
.mhead{animation:fadeUp .38s .04s cubic-bezier(.22,.9,.3,1) both}

/* content blocks stagger on every tab switch */
#dBody>*{animation:fadeUp .34s cubic-bezier(.22,.9,.3,1) both}
#dBody>*:nth-child(1){animation-delay:.02s}
#dBody>*:nth-child(2){animation-delay:.09s}
#dBody>*:nth-child(3){animation-delay:.16s}

/* feature rows cascade */
.fl{animation:slideIn .3s cubic-bezier(.22,.9,.3,1) both}
.fl:nth-child(1){animation-delay:.05s} .fl:nth-child(2){animation-delay:.09s}
.fl:nth-child(3){animation-delay:.13s} .fl:nth-child(4){animation-delay:.17s}
.fl:nth-child(5){animation-delay:.21s} .fl:nth-child(6){animation-delay:.25s}
.fl:nth-child(7){animation-delay:.29s} .fl:nth-child(8){animation-delay:.33s}
.fl:nth-child(9){animation-delay:.37s} .fl:nth-child(10){animation-delay:.41s}
.fl:nth-child(11){animation-delay:.45s} .fl:nth-child(12){animation-delay:.49s}
.dot{animation:pop .34s cubic-bezier(.3,1.5,.5,1) both;animation-delay:inherit}

/* demo steps cascade */
.step{animation:fadeUp .3s cubic-bezier(.22,.9,.3,1) both}
.step:nth-child(2){animation-delay:.05s} .step:nth-child(3){animation-delay:.10s}
.step:nth-child(4){animation-delay:.15s} .step:nth-child(5){animation-delay:.20s}
.step.done{animation:glow .55s ease-out 1}
.step.done .box{animation:pop .32s cubic-bezier(.3,1.6,.5,1) both}

/* pitch lines */
.say{animation:fadeUp .34s cubic-bezier(.22,.9,.3,1) both}
.say:nth-child(2){animation-delay:.07s}
.ob{animation:fadeUp .32s cubic-bezier(.22,.9,.3,1) both}
.ob:nth-child(2){animation-delay:.06s} .ob:nth-child(3){animation-delay:.12s}

/* table rows */
tbody tr{animation:fadeIn .3s both}
tbody tr:nth-child(2){animation-delay:.03s} tbody tr:nth-child(3){animation-delay:.06s}
tbody tr:nth-child(4){animation-delay:.09s} tbody tr:nth-child(5){animation-delay:.12s}
tbody tr:nth-child(6){animation-delay:.15s} tbody tr:nth-child(7){animation-delay:.18s}

/* shine sweep across the model header */
.mhead{position:relative;overflow:hidden}
.mhead::after{content:"";position:absolute;top:0;left:0;width:38%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);
  animation:sweep 1.5s .25s ease-out 1}

/* tap ripple */
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);
  transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}
.mcard,.step,.tab,.reset{position:relative;overflow:hidden}

/* progress bar */
.prog{height:5px;border-radius:3px;background:#16204A;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,#26A0DA,#2FA84F);
  transition:width .45s cubic-bezier(.22,.9,.3,1);animation:barGrow .6s both}
}
/* always-on micro-interactions */
.mcard,.step,.tab,.reset{transition:transform .12s ease, background .18s ease,
  border-color .18s ease}
.mcard:active,.step:active,.reset:active{transform:scale(.975)}
.tab{transition:background .2s ease,color .2s ease,border-color .2s ease,transform .12s}
.tab:active{transform:scale(.94)}
.chev{transition:transform .18s ease}
.mcard:active .chev{transform:translateX(4px)}
.cardimg{animation:fadeIn .5s both}


/* ================= TV ILLUSTRATION ================= */
.tvwrap{padding:4px 0 2px;display:flex;flex-direction:column;align-items:center}
.tv{width:100%;max-width:340px;position:relative}
.bezel{position:relative;width:100%;padding:7px;border-radius:11px;
  background:linear-gradient(160deg,#3A4570,#141B33 60%,#232C4E);
  box-shadow:0 12px 26px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07)}
.screen{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;
  overflow:hidden;background:#05070F}
.wash{position:absolute;inset:0;opacity:.92}
.vig{position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.55) 100%)}
.shine{position:absolute;top:0;left:0;width:42%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),transparent);
  transform:translateX(-140%)}
.hometxt{position:absolute;left:8px;top:7px;font-size:8px;letter-spacing:1.4px;
  color:rgba(255,255,255,.82);font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.apps{position:absolute;left:8px;right:8px;bottom:7px;display:flex;gap:5px}
.app{flex:1;height:23px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:7.5px;font-weight:800;color:#fff;
  letter-spacing:.2px;text-align:center;line-height:1.1;padding:2px;
  box-shadow:0 2px 6px rgba(0,0,0,.4)}
.app.sel{outline:2px solid #fff;outline-offset:1px}
.feathero{position:absolute;left:9px;right:9px;top:30px;height:56px}
.feathero span{position:absolute;left:0;right:0;top:0;opacity:0;text-align:center;
  font-size:16px;font-weight:900;letter-spacing:.6px;color:#fff;line-height:1.15;
  text-shadow:0 2px 10px rgba(0,0,0,.8),0 0 22px rgba(255,255,255,.28)}
.feathero span i{display:block;font-style:normal;font-size:8px;font-weight:700;
  letter-spacing:2.2px;color:rgba(255,255,255,.72);margin-top:5px}
.dots{position:absolute;left:0;right:0;bottom:38px;display:flex;gap:5px;
  justify-content:center}
.dots b{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots b.on{background:#fff;box-shadow:0 0 7px rgba(255,255,255,.8)}
.dvbadge{position:absolute;right:8px;top:6px;font-size:7px;font-weight:800;
  letter-spacing:.8px;color:#0B0F1E;background:#F2B01E;border-radius:3px;
  padding:2.5px 5px;box-shadow:0 2px 7px rgba(0,0,0,.45)}
.brandbar{text-align:center;font-size:8px;letter-spacing:3.4px;font-weight:800;
  color:#8C9AC4;margin-top:4px}
.neck{width:34px;height:13px;margin:0 auto;
  background:linear-gradient(180deg,#39436D,#212949)}
.base{width:112px;height:6px;margin:0 auto;border-radius:0 0 5px 5px;
  background:linear-gradient(180deg,#39436D,#1A2140);
  box-shadow:0 6px 14px rgba(0,0,0,.5)}

/* small TV on the home list */
.tvmini-h{flex:0 0 auto;width:58px}
.tvmini{flex:0 0 auto;width:58px}
.tvmini .bezel{padding:3px;border-radius:6px}
.tvmini .screen{border-radius:3px}
.tvmini .neck{width:14px;height:5px}
.tvmini .base{width:34px;height:3px}

@media (prefers-reduced-motion: no-preference){
  @keyframes powerOn{
    0%{transform:scaleY(.012) scaleX(.7);opacity:0;filter:brightness(3)}
    45%{transform:scaleY(.012) scaleX(1);opacity:1;filter:brightness(3)}
    100%{transform:scaleY(1) scaleX(1);opacity:1;filter:brightness(1)}}
  @keyframes washShift{
    0%{transform:scale(1.06) translate(0,0)}
    50%{transform:scale(1.14) translate(-2%,-2%)}
    100%{transform:scale(1.06) translate(0,0)}}
  @keyframes appIn{
    0%{transform:translateY(14px) scale(.8);opacity:0}
    65%{transform:translateY(-2px) scale(1.05)}
    100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes appFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes focusHop{
    0%,18%{outline-color:#fff;transform:scale(1.1)}
    22%,100%{outline-color:transparent;transform:scale(1)}}
  @keyframes featIn{
    0%{opacity:0;transform:translateY(12px) scale(.86);filter:blur(3px)}
    4%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
    21%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
    25%{opacity:0;transform:translateY(-10px) scale(1.06);filter:blur(3px)}
    100%{opacity:0}}
  @keyframes dotOn{
    0%,1%{background:rgba(255,255,255,.3);box-shadow:none;transform:scale(1)}
    4%,21%{background:#fff;box-shadow:0 0 7px rgba(255,255,255,.85);transform:scale(1.35)}
    25%,100%{background:rgba(255,255,255,.3);box-shadow:none;transform:scale(1)}}
  @keyframes scan{0%{transform:translateX(-140%)}100%{transform:translateX(340%)}}
  @keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

  .screen{animation:powerOn .75s cubic-bezier(.2,.9,.3,1) both}
  .wash{animation:washShift 11s ease-in-out infinite}
  .shine{animation:scan 3.6s 1.1s ease-in-out infinite}
  .app{animation:appIn .46s cubic-bezier(.3,1.4,.5,1) both,
                appFloat 3.4s ease-in-out infinite}
  .app:nth-child(1){animation-delay:.55s,1.4s}
  .app:nth-child(2){animation-delay:.63s,1.6s}
  .app:nth-child(3){animation-delay:.71s,1.8s}
  .app:nth-child(4){animation-delay:.79s,2.0s}
  .app:nth-child(5){animation-delay:.87s,2.2s}
  .app.sel{animation:appIn .46s cubic-bezier(.3,1.4,.5,1) both,
                     focusHop 6s 1.4s ease-in-out infinite}
  .feathero span{animation:featIn 10s linear infinite}
  .dots b{animation:dotOn 10s linear infinite}
  .dvbadge{animation:appIn .5s 1s cubic-bezier(.3,1.5,.5,1) both,
                     badgePulse 2.6s 1.6s ease-in-out infinite}
  .hometxt{animation:fadeIn .6s .8s both}
  .tvwrap{animation:fadeUp .5s cubic-bezier(.22,.9,.3,1) both}
  .tvmini .screen{animation:powerOn .6s both}
}

</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="back hide" id="backBtn">‹ Back</button>
    <div class="flag"><i></i><i></i><i></i></div>
    <div style="flex:1;min-width:0">
      <h1 id="hTitle">Lloyd Demo Coach</h1>
      <div class="tag" id="hTag">LED TV · Model-wise demo &amp; pitch guide</div>
    </div>
  </div>
</header>

<div id="tabsBar" class="tabs hide"></div>

<div class="wrap">
  <!-- HOME -->
  <div id="home">
    <div class="lead">
      <b>Tap the model in front of the customer.</b>
      <p>Features · Demo · Pitch · Compare · Objections</p>
    </div>
    <div id="homeList"></div>
  </div>

  <!-- DETAIL -->
  <div id="detail" class="hide">
    <div class="mhead">
      <div class="n" id="dName"></div>
      <div class="t" id="dTag"></div>
    </div>
    <div id="dBody"></div>
  </div>
</div>

<footer>
  Lloyd &amp; Havells · East Zone Training<br>
  For internal training use only. Not to be shared outside the organization.
</footer>

<script>
/* =====================================================================
   DATA — five Lloyd models from the battle cards
   ===================================================================== */
const MODELS = [
{
  id:"ws500",
  osKind:"webos", osLabel:"WEBOS  HOME", focus:0, badge:"QLED",
  wash:"linear-gradient(125deg,#0B4F8A,#12A0B8 30%,#6FD3A6 55%,#F2B01E 78%,#E0523C)",
  hi:["QLED|QUANTUM DOT DISPLAY","WEBOS|SMART OPERATING SYSTEM","HDR10|HIGH DYNAMIC RANGE","DOLBY AUDIO|10W SOUND OUTPUT"], size:"32\"", color:"#26A0DA", card:"img/card-32.jpg",
  name:"32WS500 / 501",
  spec:"QLED · WebOS · Dolby Audio",
  feat:[
    "QLED display",
    "WebOS operating system",
    "HDR10",
    "Basic / Voice remote",
    "10W sound",
    "Dolby Audio"
  ],
  demo:[
    "Same clip on both screens. Saturated colour.",
    "Open WebOS home. Launch an app. Repeat on rival.",
    "Match loudness. Play a dialogue scene.",
    "Hand him the remote."

function tvHTML(m, mini){

    (mini ? '' : '<div class="brandbar">L L O Y D</div>') +
  '</div>';
}

/* ---- tap ripple ---- */
function rippleAt(el, ev){
  try{
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = el.getBoundingClientRect();
    const d = Math.max(r.width, r.height);
    const s = document.createElement("span");
    s.className = "rip";
    s.style.width = s.style.height = d + "px";
    const x = (ev && ev.clientX ? ev.clientX : r.left + r.width/2) - r.left - d/2;
    const y = (ev && ev.clientY ? ev.clientY : r.top  + r.height/2) - r.top  - d/2;
    s.style.left = x + "px"; s.style.top = y + "px";
    el.appendChild(s);
    setTimeout(() => s.remove(), 600);
  }catch(e){}
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
